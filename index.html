<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دردشة</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .app {
      max-width: 500px;
      margin: auto;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 20px;
    }

    .message {
      background: #eee;
      padding: 12px 16px;
      border-radius: 15px;
      margin-bottom: 10px;
      width: fit-content;
    }

    .input {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
    }

    button {
      border: 0;
      background: #111;
      color: white;
      padding: 12px 18px;
      border-radius: 20px;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>💬 دردشة</header>

    <div class="messages" id="messages">
      <div class="message">مرحباً 👋</div>
    </div>

    <div class="input">
      <input id="text" placeholder="اكتب رسالتك...">
      <button onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("text");
      const messages = document.getElementById("messages");

      if (input.value.trim() === "") return;

      const message = document.createElement("div");
      message.className = "message";
      message.textContent = input.value;

      messages.appendChild(message);
      input.value = "";
    }
  </script>
</body>
</html>
